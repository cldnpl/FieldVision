name: FieldVision
options:
  bundleIdPrefix: com.fieldvision
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FieldVision:
    type: application
    platform: iOS
    sources:
      - FieldVision
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fieldvision.app
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    info:
      path: FieldVision/Info.plist
      properties:
        CFBundleDisplayName: FieldVision
        NSCameraUsageDescription: >-
          FieldVision uses the camera and LiDAR sensor to detect obstacles on your
          path and describe them through sound and vibration. Nothing is recorded,
          stored, or sent anywhere.
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
